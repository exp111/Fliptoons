<div class="market">
  <div class="prices">
    @for (price of marketPrices; track $index) {
      <span class="price" [class.unavailable]="marketPrices[$index] > this.fame()">{{price}}</span>
    }
  </div>
  <div class="slots">
    <!-- TODO: use slot comp for cards? -->
    @for (slot of slots(); track $index) {
      <img [src]="slot.getImg()" [class.clickable]="hireable() && marketPrices[$index] <= this.fame()" (click)="hireCard(slot)">
    }
  </div>
</div>
