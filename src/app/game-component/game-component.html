<span>Phase: {{Phase[currentPhase()]}}</span>
<!-- Market -->
<span>Cards in Market Deck: {{marketDeck().length}}, Actions left: {{marketActionsLeft()}}</span>
<app-market-component [(slots)]="market" [hireable]="canHire()" (hire)="onHire($event)"/>
<!-- Playing Zone -->
<span>Cards in Deck: {{deck().length}}, Fame: {{currentFame()}}</span>
<button (click)="nextPhase()" [disabled]="isWorking()">Next</button>
<div class="slots">
  @for (_ of fake_slots; track $index) {
    <app-slot-component [card]="grid()[$index]"></app-slot-component>
  }
</div>
