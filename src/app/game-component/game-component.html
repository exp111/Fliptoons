<span>Phase: {{Phase[currentPhase()]}}</span>
<!-- Market -->
<span>Cards in Market Deck: {{marketDeck().length}}, Actions left: {{marketActionsLeft()}}</span>
<app-market-component [(slots)]="market" [hireable]="canHireOrDismiss()" [fame]="currentFame()" (hire)="onHire($event)"/>
<!-- Playing Zone -->
<span>Cards in Deck: {{deck().length}}, Dismissed: {{dismissed().length}}, Fame: {{currentFame()}}</span>
<button (click)="nextPhase()" [disabled]="isWorking()">Next</button>
<div class="slots">
  @for (slot of grid(); track $index) {
    <app-slot-component [slot]="slot" [dismissable]="canHireOrDismiss()" [fame]="currentFame()" (dismiss)="onDismiss($event)"></app-slot-component>
  }
</div>
